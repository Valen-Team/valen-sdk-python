name: SDK checks
on: [push, pull_request, workflow_dispatch]
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test,server]' numpy 'packaging>=23' build
      - run: python -m pytest
      - run: python -m build
