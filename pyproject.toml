[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "valen-sdk"
version = "0.4.0"
description = "Typed local ONNX, HTTP and LLM-comparison access to Valen decisions"
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["httpx>=0.28,<1", "pydantic>=2.9,<3"]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.31,<2", "numpy>=1.26", "packaging>=23", "tokenizers>=0.22,<1", "huggingface-hub>=1,<3", "Pillow>=10", "jinja2>=3.1,<4"]
cuda = ["onnxruntime-gpu[cuda,cudnn]>=1.31,<2", "numpy>=1.26", "packaging>=23", "tokenizers>=0.22,<1", "huggingface-hub>=1,<3", "Pillow>=10", "jinja2>=3.1,<4"]
video = ["av>=16,<20", "Pillow>=10"]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<10"]

[project.urls]
Homepage = "https://github.com/valen-team/valen-sdk-python"
Source = "https://github.com/valen-team/valen-sdk-python"

[project.scripts]
valen = "valen_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["valen_sdk*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
